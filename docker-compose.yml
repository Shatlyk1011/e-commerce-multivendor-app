services:
  # Local development only. All published ports bind to loopback.
  # ── Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medusa_db}
      POSTGRES_USER: ${POSTGRES_USER:-medusa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432" # Exposed on port 5433 to avoid clashing with host Postgres

  # ── Object Storage (S3-compatible) ───────────────────────────
  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  # Creates the public media bucket once MinIO is ready. Object keys use
  # `<vendor-shop-name>/...` for vendor media.
  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-medusa-media}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done
        && mc mb --ignore-existing local/"$${MINIO_BUCKET}"
        && mc anonymous set download local/"$${MINIO_BUCKET}"

  # ── Full-text Search ──────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:latest
    restart: always
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY in .env}
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meilisearch_data:/meili_data

  # ── Medusa Backend ────────────────────────────────────────────
  medusa:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      meilisearch:
        condition: service_started
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-medusa}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-medusa_db}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-medusa-media}
      MINIO_REGION: us-east-1
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9010/medusa-media}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET in .env}
      STORE_CORS: http://localhost:3000
      ADMIN_CORS: http://localhost:9000,http://localhost:5173
      AUTH_CORS: http://localhost:3000,http://localhost:3001,http://localhost:9000
      MEDUSA_ADMIN_ONBOARDING_TYPE: default
      MEDUSA_BACKEND_URL: http://localhost:9000

  # ── Storefront (Next.js — Buyer) ──────────────────────────────
  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
      args:
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_STOREFRONT_URL: http://localhost:3000
    restart: always
    depends_on:
      - medusa
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-}

  # ── Vendor Portal (Next.js — Sellers) ─────────────────────────
  vendor-portal:
    build:
      context: .
      dockerfile: apps/vendor-portal/Dockerfile
      args:
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-}
    restart: always
    depends_on:
      - medusa
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000

volumes:
  postgres_data:
  minio_data:
  meilisearch_data:
